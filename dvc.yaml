# Legiscope DVC Pipeline
#
# Process a single legal code through: parse -> segment -> embed -> index
#
# Default jurisdiction is set in params.yaml. Override at runtime:
#
#   dvc exp run \
#     -S jurisdiction.state=CA \
#     -S jurisdiction.locality=LosAngeles \
#     -S jurisdiction.code_slug=municipal-code
#
# For state-level codes, use locality=State:
#
#   dvc exp run \
#     -S jurisdiction.state=CA \
#     -S jurisdiction.locality=State \
#     -S jurisdiction.code_slug=penal-code
#
# Prerequisites:
#   1. Initialise the jurisdiction (not a DVC stage):
#        python scripts/init.py \
#          --state CA --locality LosAngeles \
#          --code-slug municipal-code --code-name "LA Municipal Code"
#   2. Place raw source files (DOCX, TXT) in data/laws/{state}/{locality}/{code_slug}/raw/
#   3. If source file is DOCX, run conversion script to produce TXT:
#        uv run scripts/convert_docx.sh "data/laws/CA/LosAngeles/municipal-code/raw"

stages:
    validate:
        cmd: >-
            bash -c 'bash scripts/dvc_python.sh -c "import legiscope; print(f\"Package import works: {legiscope.__file__}\")" && mkdir -p tmp && echo ok > tmp/validate_import.ok'
        deps:
            - scripts/dvc_python.sh
            - src/legiscope/__init__.py
            - pyproject.toml
        outs:
            - tmp/validate_import.ok:
                cache: false

    parse:
        cmd: >-
            bash scripts/dvc_python.sh scripts/parse.py --state ${jurisdiction.state} --locality ${jurisdiction.locality} --code-slug ${jurisdiction.code_slug}
        deps:
            - scripts/dvc_python.sh
            - scripts/parse.py
            - tmp/validate_import.ok
            - src/legiscope/parse
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/raw
        params:
            - jurisdiction
            - llm
        outs:
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/code.md
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/headings.parquet
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/parse_diagnostics.json

    segment:
        cmd: >-
            bash scripts/dvc_python.sh scripts/segment.py --state ${jurisdiction.state} --locality ${jurisdiction.locality} --code-slug ${jurisdiction.code_slug}
        deps:
            - scripts/dvc_python.sh
            - scripts/segment.py
            - src/legiscope/segment.py
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/code.md
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/headings.parquet
        params:
            - jurisdiction
            - segmentation
        outs:
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/sections.parquet
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/segments.parquet
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/relations.parquet
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/external_references.parquet

    embed:
        cmd: >-
            bash scripts/dvc_python.sh scripts/embed.py --state ${jurisdiction.state} --locality ${jurisdiction.locality} --code-slug ${jurisdiction.code_slug}
        deps:
            - scripts/dvc_python.sh
            - scripts/embed.py
            - src/legiscope/embeddings.py
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/sections.parquet
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/segments.parquet
        params:
            - jurisdiction
            - embeddings
        outs:
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/embeddings.parquet

    index:
        cmd: >-
            bash scripts/dvc_python.sh scripts/index.py --state ${jurisdiction.state} --locality ${jurisdiction.locality} --code-slug ${jurisdiction.code_slug}
        deps:
            - scripts/dvc_python.sh
            - scripts/index.py
            - src/legiscope/embeddings.py
            - data/laws/${jurisdiction.state}/${jurisdiction.locality}/${jurisdiction.code_slug}/embeddings.parquet
        params:
            - jurisdiction
            - embeddings.default_provider
            - retrieval.distance_metric
