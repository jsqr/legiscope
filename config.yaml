# Infrastructure configuration
# Not tracked by DVC - deployment/environment specific

paths:
  # Root data directory (override via LEGISCOPE_DATA_DIR env var)
  data_dir: "data"

  # Subdirectories (relative to data_dir)
  laws_dir: "laws"
  chroma_db_dir: "chroma_db"
  queries_dir: "queries"
  output_dir: "output"
  default_queries_file:
    - "DPL_queries_expanded_nested_fixed_20260501.csv"
    - "SSP_queries_20260513.csv"
  # COEP-specific benchmark fixture path. Unlike the directories above, this is
  # resolved relative to the repository/config root (or used as-is if absolute),
  # not under data_dir.
  monqcle_report:
    - "coep/data/monqcle_data/Drug_Paraphernalia_Laws_Standard_Report_20260501.csv"
    - "coep/data/monqcle_data/SSP_Laws_Standard_Report_20260513.csv"

database:
  chromadb:
    default_collection: "legal_code"
    model_suffix: true  # Append model name to collection (e.g., legal_code_mistral)

llm:
  dashscope:
    # DashScope exposes an OpenAI-compatible endpoint used for Qwen, DeepSeek,
    # Kimi, and other Alibaba-hosted models.
    # International: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    # China/Beijing: https://dashscope.aliyuncs.com/compatible-mode/v1
    # Some Alibaba token plans expose an account-specific compatible-mode base
    # URL; prefer that exact value when it is provided in the console.
    api_base: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"

  litellm:
    # Set these when routing through a LiteLLM proxy or gateway.
    # Leave unset when LiteLLM should talk directly to OpenAI/Anthropic/Gemini
    # using the provider-specific environment variables.
    api_base:
    api_key_env:

logging:
  level: "DEBUG"  # Use INFO by default; override to DEBUG for development
  batch_log_interval: 1000
