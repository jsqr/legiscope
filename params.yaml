# Pipeline parameters tracked by DVC
# Changes here trigger pipeline reruns

# Jurisdiction targeting (override via: dvc exp run -S jurisdiction.state=CA ...)
jurisdiction:
  state: PA
  locality: Philadelphia
  code_slug: municipal-code
  code_name: Philadelphia Municipal Code

# LLM configuration
llm:
  default_provider: openai
  # `self_hosted` enables local threaded concurrency for vLLM/HPC-style serving.
  # Set to `external` for cloud APIs like Mistral/OpenAI/OpenRouter.
  source: self_hosted

  providers:
    openai:
      fast: Qwen/Qwen3.5-27B
      powerful: Qwen/Qwen3.5-27B
      
    mistral:
      fast: mistral-small-2506
      powerful: mistral-large-2512

    ollama:
      fast: gemma3:4b
      powerful: gemma3:4b
      num_ctx: 4096

  temperature: 0.0
  max_retries: 3
  timeout: 1000

parse:
  scan:
    initial_sample_count: 200
    max_iterations: 5
    score_threshold: 0.7
    max_retries: 3
    timeout: 800
    max_tokens: 2400

# Embedding configuration
embeddings:
  default_provider: mistral
  chroma_batch_size: 100

  providers:
    mistral:
      model: codestral-embed-2505
      batch_size: 100

    ollama:
      model: embeddinggemma
      batch_size: 1

    openrouter:
      model: qwen/qwen3-embedding-8b
      batch_size: 100

    openai:
      model: text-embedding-3-small
      batch_size: 100

  dtype: float32

# Segmentation settings
segmentation:
  embedding_model_token_limit: 1024
  llm_context_limit: 65536

# Retrieval: vector search and post-retrieval filtering
retrieval:
  n_results: 10
  distance_metric: l2
  debug: true  

  lexical_overfetch_factor: 3
  lexical_reranking:
    enabled: true

  # HYDE query rewriting (LLM-powered, uses fast model)
  hyde:
    enabled: false

  # Post-retrieval LLM relevance filter (uses fast model)
  relevance_filter:
    enabled: false
    threshold: 0.5
    max_concurrency: 4
    target_concurrent_prompt_tokens: 16000
    prompt_overhead_tokens: 600

# Benchmark evaluation settings
benchmark:
  evaluation:
    max_concurrency: 4

# Query: LLM analysis of retrieved context (uses powerful model)
query:
  validation:
    enabled: true
    exact_match_threshold: 1.0
    fuzzy_match_threshold: 0.9
  review:
    enabled: true
    topics:
      - prohibited_activity
      - penalty
      - exemption_presence