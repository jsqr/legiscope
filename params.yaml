# Pipeline parameters tracked by DVC
# Changes here trigger pipeline reruns

# Jurisdiction targeting (override via: dvc exp run -S jurisdiction.state=CA ...)
jurisdiction:
  state: IL
  locality: WindyCity
  code_slug: municipal-code
  code_name: "WindyCity Municipal Code"

# LLM configuration
llm:
  default_provider: mistral

  providers:
    openai:
      fast: gpt-4.1-mini
      powerful: gpt-4.1

    mistral:
      fast: mistral-small-2506
      powerful: mistral-large-2512

    ollama:
      fast: qwen3:8b
      powerful: qwen3:30b
      num_ctx:

  temperature: 0.0
  max_retries: 3
  timeout: 300

# Embedding configuration
embeddings:
  default_provider: ollama

  providers:
    mistral:
      model: mistral-embed
      batch_size: 100

    ollama:
      model: embeddinggemma
      batch_size:

  dtype: float32

# Segmentation settings
segmentation:
  token_limit: 256
  words_per_token: 0.75

# Retrieval: vector search and post-retrieval filtering
retrieval:
  n_results: 10
  distance_metric: l2

  # HYDE query rewriting (LLM-powered, uses fast model)
  hyde:
    enabled: false

  # Post-retrieval LLM relevance filter (uses fast model)
  relevance_filter:
    enabled: false
    threshold: 0.5

# Query: LLM analysis of retrieved context (uses powerful model)
query:
  validation:
    enabled: true
    exact_match_threshold: 1.0
    fuzzy_match_threshold: 0.9
